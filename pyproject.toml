[project]
name = "dontfeartheripper"
version = "0.0.3"
description = "Music library cleanup and rename tool for FLAC collections"
readme = "README.md"
authors = [
    { name = "fnngn", email = "s.j.fischer@live.de" }
]
requires-python = ">=3.14"
dependencies = [
    "mutagen>=1.48.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
dftr = "dontfeartheripper.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
